services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: normoscan
      POSTGRES_PASSWORD: normoscan
      POSTGRES_DB: normoscan
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_storage:/qdrant/storage]

  backend:
    build:
      context: ./backend
      args:
        WITH_VLM: "false"
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port $${API_PORT:-8000} --reload"
    volumes: [./backend:/app, ./storage:/app/storage]
    ports: ["${API_PORT:-8000}:${API_PORT:-8000}"]
    depends_on: [postgres, redis, qdrant]
    environment:
      DATABASE_URL: postgresql+psycopg://normoscan:normoscan@postgres:5432/normoscan
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      VECTOR_DB: qdrant
      VLM_MODEL: ${VLM_MODEL:-google/gemma-3-12b-it}
      VLM_QUANTIZATION: ${VLM_QUANTIZATION:-awq-4bit}
      VLM_ENGINE: ${VLM_ENGINE:-mock}
      VLM_API_URL: ${VLM_API_URL-}
      VLM_API_KEY: ${VLM_API_KEY-}
      MAX_CONTEXT_WINDOW: ${MAX_CONTEXT_WINDOW:-8192}
      API_PORT: ${API_PORT:-8000}
    env_file: [.env]

  celery_worker:
    build:
      context: ./backend
      args:
        WITH_VLM: "false"
    command: celery -A app.celery_app worker --loglevel=INFO -Q high,normoscan,low --concurrency=1
    volumes: [./backend:/app, ./storage:/app/storage]
    depends_on: [redis, postgres, qdrant, backend]
    environment:
      DATABASE_URL: postgresql+psycopg://normoscan:normoscan@postgres:5432/normoscan
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      VECTOR_DB: qdrant
      VLM_MODEL: ${VLM_MODEL:-google/gemma-3-12b-it}
      VLM_QUANTIZATION: ${VLM_QUANTIZATION:-awq-4bit}
      VLM_ENGINE: ${VLM_ENGINE:-mock}
      VLM_API_URL: ${VLM_API_URL-}
      VLM_API_KEY: ${VLM_API_KEY-}
    env_file: [.env]

  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-8501}:8501"]
    volumes: [./frontend:/app]
    environment:
      API_URL: http://backend:${API_PORT:-8000}
      API_PORT: ${API_PORT:-8000}
      FRONTEND_PORT: ${FRONTEND_PORT:-8501}
    depends_on: [backend]

volumes:
  postgres_data:
  qdrant_storage:
