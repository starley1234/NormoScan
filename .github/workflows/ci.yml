name: NormoScan CI

on:
  push:
    branches: [main, arena/*]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt
          .venv/bin/pip install pytest httpx
      - name: Unit & RAG & VLM
        run: .venv/bin/pytest tests/unit tests/rag tests/vlm -q
      - name: Integration (TestContainers)
        run: .venv/bin/pytest tests/integration -q
      - name: Lint
        run: .venv/bin/python -m py_compile backend/app/main.py

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker compose build backend || echo "docker not available in CI"
