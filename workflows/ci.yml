name: NormoScan CI
on:
  push:
    branches: [main, arena/*]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt
          .venv/bin/pip install pytest httpx Pillow
      - name: Unit tests
        run: .venv/bin/pytest tests/unit -q
      - name: RAG tests
        run: .venv/bin/pytest tests/rag -q
      - name: VLM tests
        run: .venv/bin/pytest tests/vlm -q
      - name: Web UI tests
        run: .venv/bin/pytest tests/web -q
      - name: MCP tests
        run: .venv/bin/pytest tests/mcp -q
      - name: Security tests
        run: .venv/bin/pytest tests/security -q
      - name: Task tests
        run: .venv/bin/pytest tests/tasks -q
      - name: Integration tests
        run: .venv/bin/pytest tests/integration -q
