{% extends "base.html" %}
{% block title %}Вход — НормоСкан{% endblock %}
{% block header %}Вход в систему{% endblock %}

{% block content %}
<div style="max-width: 360px; margin: 60px auto;">
    <div class="card">
        <div class="card-header">
            <span class="card-title">📐 НормоСкан</span>
        </div>
        <form id="login-form" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Логин</label>
                <input type="text" class="form-input" id="username" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" class="form-input" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
        </form>
        <p class="text-muted mt-3" style="font-size: 12px;">
            Demo: admin/admin123, norm/norm123, engineer/eng123
        </p>
    </div>
</div>

<script>
async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    try {
        await login(username, password);
        window.location.href = '/web/';
    } catch (err) {
        toast(err.message, 'error');
    }
    return false;
}
</script>
{% endblock %}
